[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ruoxue-backend"
version = "0.3.0"
description = "Ruoxue — 多模态 AI Agent 数字人助手后端"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]  # line-length handled by formatter

# FastAPI uses File() in route defaults by design
[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]                   # sys.path manipulation before imports
"agent/agent_graph.py" = ["E402"]    # deepseek-skills import
"routes.py" = ["E402", "B008"]         # FastAPI route decorators
"agent/chroma_memory.py" = ["F841"]    # unused variable intentional
"agent/emotional_agent.py" = ["UP042"]  # str + Enum intentional
"tts/viseme_mapper.py" = ["C408"]      # dict() style is intentional

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "--strict-markers"]
