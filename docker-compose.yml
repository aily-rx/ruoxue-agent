services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ruoxue-backend
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - ASR_MODEL_DIR=/app/model_assets/asr/sensevoice-small-int8
    volumes:
      - ./model_assets:/app/model_assets:ro
      - ./skills:/app/skills:ro
      - ./chroma_data:/app/chroma_data
      - ./faiss_data:/app/faiss_data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ruoxue-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
